name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to build
        required: true
        type: string
      platform:
        description: Platforms to include in this candidate
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
          - both

permissions:
  contents: read

jobs:
  preflight:
    name: Production release gate
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate the requested version
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_VERSION" = "$(node -p "require('./package.json').version")"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --exclude rrmm-desktop --locked
      - run: cargo clippy --workspace --exclude rrmm-desktop --all-targets --locked -- -D warnings
      - run: pnpm check
      - run: pnpm test
      - run: pnpm desktop:test
      - run: pnpm desktop:build:web
      - run: pnpm desktop:packaging:check

  linux:
    name: Linux AppImage
    if: ${{ inputs.platform == 'linux' || inputs.platform == 'both' }}
    needs: preflight
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: RRMM_CONTAINER_RUNTIME=docker ./packaging/linux/build-linux.sh release
      - name: Package the AppImage in a ZIP
        shell: bash
        run: |
          appimage="target/release/bundle/appimage/RR Mod Manager_${RELEASE_VERSION}_amd64.AppImage"
          test -f "$appimage"
          zip -j "target/release/bundle/appimage/RR-Mod-Manager-${RELEASE_VERSION}-Linux-x64.zip" "$appimage"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rrmm-${{ inputs.version }}-linux
          path: |
            target/release/bundle/appimage/RR Mod Manager_${{ inputs.version }}_amd64.AppImage
            target/release/bundle/appimage/RR-Mod-Manager-${{ inputs.version }}-Linux-x64.zip
          if-no-files-found: error

  windows:
    name: Windows NSIS (unsigned)
    if: ${{ inputs.platform == 'windows' || inputs.platform == 'both' }}
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - name: Run Windows launch and stack regression tests
        run: cargo test --locked --package rrmm-steam --package rrmm-desktop
      - name: Run the complete sandboxed UE4SS flow
        run: pnpm desktop:test:windows:ue4ss
      - name: Run generated mod import and deployment through both real workers
        run: pnpm desktop:test:windows:archive
      - name: Build and verify the explicitly unsigned application
        shell: pwsh
        run: ./tools/build-windows-unsigned-release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rrmm-${{ inputs.version }}-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  assemble:
    name: Checksums, SBOM, attestation and notices
    if: >-
      ${{
        always() &&
        needs.preflight.result == 'success' &&
        (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
        (needs.windows.result == 'success' || needs.windows.result == 'skipped')
      }}
    needs: [preflight, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rrmm-${{ inputs.version }}-*
          path: release
          merge-multiple: true
      - run: pnpm release:licenses release/THIRD_PARTY_NOTICES.md
      - name: Copy public release documents
        shell: bash
        run: >-
          cp LICENSE SECURITY.md PRIVACY.md docs/BETA_TESTING.md
          "docs/RELEASE_${RELEASE_VERSION}.md"
          "docs/RELEASE_${RELEASE_VERSION}_CHECKLIST.md"
          release/
      - name: Generate pinned SPDX SBOM
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/workspace"
          anchore/syft@sha256:1288ea4c8b38767b4e620c1e312c8cb26b6e887a99b4f07ab6cd19fc6f225026
          dir:/workspace
          -o "spdx-json=/workspace/release/RR-Mod-Manager-${RELEASE_VERSION}.spdx.json"
      - run: pnpm release:metadata release --platform "$RELEASE_PLATFORM"
      - name: Attest every release-candidate file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rr-mod-manager-${{ inputs.version }}-${{ inputs.platform }}-release-candidate
          path: release/*
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux desktop build dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libayatana-appindicator3-dev librsvg2-dev libssl-dev
          libwebkit2gtk-4.1-dev libxdo-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Prepare desktop parser sidecars
        run: node tools/prepare-desktop-sidecars.mjs debug
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  phase0-contracts:
    name: TypeScript contracts and desktop frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Run desktop UI tests
        run: pnpm desktop:test
      - name: Build desktop web frontend
        run: pnpm desktop:build:web
      - run: pnpm desktop:packaging:check
      - run: pnpm release:contract

  windows-installer-smoke:
    name: Windows NSIS smoke build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:packaging:check
      - name: Run the complete sandboxed UE4SS flow
        run: pnpm desktop:test:windows:ue4ss
      - name: Run generated mod import and deployment through both real workers
        run: pnpm desktop:test:windows:archive
      - run: pnpm desktop:build:windows:smoke
      - name: Validate smoke installer and embedded sidecars
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/debug/bundle/nsis/*.exe"
          if ($installer.Count -ne 1) { throw "expected exactly one NSIS installer" }
          foreach ($worker in @("rrmm-archive-worker", "rrmm-pak-worker")) {
            $path = "apps/desktop/src-tauri/binaries/$worker-x86_64-pc-windows-msvc.exe"
            if (-not (Test-Path $path)) { throw "missing sidecar: $path" }
          }

  linux-appimage-smoke:
    name: Linux AppImage smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: RRMM_CONTAINER_RUNTIME=docker ./packaging/linux/build-linux.sh debug
      - name: Validate smoke AppImage
        run: test -x "target/debug/bundle/appimage/RR Mod Manager_0.1.2_amd64.AppImage"

  windows-cross-check:
    name: Windows static cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain and Windows target
        run: rustup toolchain install 1.97.1 --profile minimal --target x86_64-pc-windows-gnu
      - name: Install Windows GNU C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Check Windows worker and Steam code
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo check --locked --target x86_64-pc-windows-gnu
          -p rrmm-deploy
          -p rrmm-application
          -p rrmm-steam
          -p rrmm-worker-sandbox
          -p rrmm-archive-worker
          -p rrmm-pak-worker

  security:
    name: Dependency and secret scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - run: pnpm install --frozen-lockfile
      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level high
      - name: Install pinned RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked Rust dependencies
        run: cargo audit
      - name: Scan repository history for secrets
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --no-banner /repo

  parser-fuzz-smoke:
    name: Parser fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Install pinned cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz archive paths
        run: cargo +nightly fuzz run archive_path -- -max_total_time=20
      - name: Fuzz archive preflight
        run: cargo +nightly fuzz run archive_preflight -- -max_total_time=20
      - name: Fuzz PAK inventory
        run: cargo +nightly fuzz run pak_inventory -- -max_total_time=20
      - name: Fuzz Nexus links
        run: cargo +nightly fuzz run nxm_url -- -max_total_time=20

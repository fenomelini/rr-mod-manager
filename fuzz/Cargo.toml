[package]
name = "rrmm-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rrmm-archive = { path = "../crates/rrmm-archive" }
rrmm-nexus = { path = "../crates/rrmm-nexus" }
rrmm-pak = { path = "../crates/rrmm-pak" }
repak-trumank = { package = "repak", git = "https://github.com/trumank/repak", rev = "e215472c51db69328b1ce77be2db24d24c1d646b", default-features = false }
tempfile = "3.20"

[[bin]]
name = "archive_preflight"
path = "fuzz_targets/archive_preflight.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_path"
path = "fuzz_targets/archive_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pak_inventory"
path = "fuzz_targets/pak_inventory.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nxm_url"
path = "fuzz_targets/nxm_url.rs"
test = false
doc = false
bench = false
